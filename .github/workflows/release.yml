name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - pr-1-amethyst
    paths:
      - src/main/resources/plugin.yml
      - build.gradle
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Read plugin version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F': *' '$1 == "version" { gsub(/["'\'' ]/, "", $2); print $2; exit }' src/main/resources/plugin.yml)"
          name="$(awk -F': *' '$1 == "name" { gsub(/["'\'' ]/, "", $2); print $2; exit }' src/main/resources/plugin.yml)"
          if [[ -z "$version" || -z "$name" ]]; then
            echo "Missing name/version in src/main/resources/plugin.yml" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "jar=${name}-${version}.jar" >> "$GITHUB_OUTPUT"
          echo "Plugin ${name} version ${version}"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Ensure release jar exists
        run: test -f "build/libs/${{ steps.meta.outputs.jar }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: build/libs/${{ steps.meta.outputs.jar }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
