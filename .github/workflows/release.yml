name: Release build

on:
  push:
    branches:
      - main
    paths:
      - src/main/resources/plugin.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and upload jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Read plugin version
        id: plugin-version
        shell: bash
        run: |
          version="$(awk -F': *' '$1 == "version" { gsub(/["'\'' ]/, "", $2); print $2; exit }' src/main/resources/plugin.yml)"
          if [ -z "$version" ]; then
            echo "Plugin version is missing in src/main/resources/plugin.yml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build

      - name: Upload jar to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.plugin-version.outputs.tag }}
          name: VibePrivate ${{ steps.plugin-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/libs/*.jar
